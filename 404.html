<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Runs before paint: prevents a flash of the wrong theme and flags JS as available -->
    <script>
        (function () {
            document.documentElement.classList.add('js');
            try {
                var stored = localStorage.getItem('theme');
                if (stored === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                } else if (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) {}
        })();
    </script>

    <title>Page not found — Ranel Zantua</title>
    <meta name="description" content="This page doesn't exist. Head back to Ranel Andrew Zantua's portfolio.">
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
